services:
  backend:
    container_name: mcraes-backend-staging
    ports: !override
      - "8200:8000"
    environment:
      - OTEL_DEPLOYMENT_ENVIRONMENT=staging
      # Staging uses its own postgres service (mcraes-postgres-staging) via the base
      # compose default (SUPABASE_DB_HOST=postgres). It must NOT join the production
      # network or point at mcraes-postgres: that made nightly syncs write into the
      # prod database with staging code, and put a second container with the alias
      # "backend" on the prod network, so the prod frontend was proxied to staging.

  frontend:
    container_name: mcraes-frontend-staging
    ports: !override
      - "3200:3000"
    build:
      args:
        VITE_OTEL_DEPLOYMENT_ENVIRONMENT: staging

  postgres:
    container_name: mcraes-postgres-staging
    ports: !override
      - "5432:5432"

  pgadmin:
    container_name: mcraes-pgadmin-staging
    ports: !override
      - "5150:80"
